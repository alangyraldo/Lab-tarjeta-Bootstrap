<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tarjeta Personal</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <div class="container my-4">

   
    <button class="btn btn-primary">Primario</button>
    <button class="btn btn-success">Éxito</button>
    <button class="btn btn-danger">Peligro</button>


    <p class="text-start mt-4">Izquierda</p>
    <p class="text-center text-danger">Centro</p>
    <p class="text-end">Derecha</p>

    <div class="card" style="width: 18rem;">
      <div class="card-header">Mi Perfil</div>
      <img src="foto.jpg" class="card-img-top" alt="Foto de perfil">
      <ul class="list-group list-group-flush">
        <li class="list-group-item">Nombre: Alan Melo Giraldo</li>
        <li class="list-group-item">Ciudad: Bogotá</li>
        <li class="list-group-item">Hobby: Ver series </li>
      </ul>
    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
